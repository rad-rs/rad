[package]
name = "rad-backend-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rad-core = { path = "../rad-core" }
wasm-bindgen = "0.2.95"
js-sys = "0.3.72"

[dependencies.web-sys]
version = "0.3.72"
features = [
    "Document", "Element", "HtmlElement", "CssStyleDeclaration", "DomTokenList", "Window",
    "ResizeObserver", "ResizeObserverEntry", "ResizeObserverBoxOptions", "DomRectReadOnly",
    "PointerEvent", "EventTarget", "HtmlHeadElement", "HtmlInputElement", "MouseEvent",
]
