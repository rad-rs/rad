<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rad preview</title>
<link data-trunk rel="rust" />
<style>
  body { margin: 0; font-family: sans-serif; background: #f3f3f3; }
  #bar { padding: 8px 12px; background: #222; color: #fff; font: 13px sans-serif; }
  #stage { position: relative; margin: 16px; }

  .rad-window {
    border: 1px solid #555;
    background: #fff;
    min-width: 160px;
    min-height: 120px;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
  }
  .rad-window-titlebar {
    background: #2b579a;
    color: #fff;
    font: 13px "Segoe UI", sans-serif;
    padding: 4px 8px;
    user-select: none;
  }
  .rad-window-body { padding: 0; }
  .rad-window-body button { font-family: "Segoe UI", sans-serif; }
</style>
</head>
<body>
<div id="bar">rad-demo — hot reload dev server (trunk)</div>
<div id="stage"><div id="rad-stage" style="position:relative; width:100%; height:100%;"></div></div>
</body>
</html>
