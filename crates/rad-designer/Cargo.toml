[package]
name = "rad-designer"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rad-core = { path = "../rad-core" }
rad-backend-web = { path = "../rad-backend-web" }
wasm-bindgen = "0.2.95"
js-sys = "0.3.72"
wasm-bindgen-futures = "0.4.45"

[dependencies.web-sys]
version = "0.3.72"
features = [
    "Document", "Element", "HtmlElement", "Window", "CssStyleDeclaration",
    "DragEvent", "DataTransfer", "HtmlTextAreaElement", "MouseEvent", "EventTarget", "DomTokenList",
    "PointerEvent", "HtmlInputElement", "Event", "Node", "HtmlSelectElement", "Storage",
    "HtmlCollection", "Blob", "Url", "HtmlAnchorElement", "BlobPropertyBag", "console", "Location",
]
