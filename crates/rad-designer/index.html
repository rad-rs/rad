<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rad designer</title>
<!-- The designer runs from the copy of the wasm that frame.html loads
     inside the #preview iframe: wasm-bindgen's casts are `instanceof`
     checks against the realm that loaded the module, and the form's
     elements live in the iframe's realm. trunk still instantiates the
     module here too; `start()` returns immediately when not in a frame. -->
<link data-trunk rel="rust" />
<link data-trunk rel="copy-file" href="frame.html" />
<link data-trunk rel="copy-file" href="skins.css" />
<link data-trunk rel="copy-file" href="monaco-bridge.js" />
<!-- build-pipeline.js is NOT copy-file'd: wasm-bindgen's `module = "/build-pipeline.js"`
     import snapshots it into its own snippets/<hash>/ directory instead,
     which is what's actually served — see that file's imports, which
     are root-absolute for exactly this reason. -->
<link data-trunk rel="copy-file" href="build-worker.js" />
<link data-trunk rel="copy-file" href="thread_spawn.js" />
<link data-trunk rel="copy-dir" href="vendor" />
<link data-trunk rel="copy-dir" href="native-toolchain" />
<link data-trunk rel="copy-file" href="coi-serviceworker.js" />
<!-- `SharedArrayBuffer` (needed by the in-browser compiler's threaded
     WASI runtime) requires cross-origin isolation. `trunk serve` has no
     way to set response headers, so this service worker re-serves every
     response with COOP/COEP added instead — the standard workaround for
     a static host with no header control. -->
<script src="coi-serviceworker.js"></script>
<!-- Monaco — the real VS Code editor component — loaded the classic way
     (AMD loader + script tag) rather than bundled, since this page has
     no bundler. `radMonacoReady` is what monaco-bridge.js (running in
     the iframe's realm) awaits before touching `window.parent.monaco`. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs/loader.min.js"></script>
<script>
  require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.49.0/min/vs" } });
  window.radMonacoReady = new Promise((resolve) => {
    require(["vs/editor/editor.main"], () => resolve());
  });
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: sans-serif; background: #f3f3f3; height: 100vh;
    display: flex; flex-direction: column;
  }
  #bar {
    display: flex; align-items: center; gap: 16px; flex: 0 0 auto;
    padding: 8px 12px; background: #222; color: #fff; font: 13px sans-serif;
  }
  #bar .spacer { flex: 1; }
  #bar select { font: 12px "Segoe UI", sans-serif; }
  /* The title gives way first, so the bar never wraps at narrow widths. */
  #bar .title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar #build-status { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar #build-target { flex: 0 0 auto; }
  #bar button, #bar label { flex: 0 0 auto; white-space: nowrap; }

  #tab-bar { display: flex; flex: 0 0 auto; background: #ddd; border-bottom: 1px solid #bbb; }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    font: 12px "Segoe UI", sans-serif; color: #333; background: #ddd;
    border-right: 1px solid #ccc; cursor: pointer; user-select: none;
  }
  .tab.active { background: #fff; font-weight: 600; }
  .tab .tab-close { color: #888; font-size: 11px; }
  .tab .tab-close:hover { color: #000; }

  #main { position: relative; flex: 1 1 auto; min-height: 0; }
  #designer-view, #tab-panels {
    position: absolute; inset: 0; display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto auto;
  }
  #tab-panels { display: none; grid-template-columns: none; }

  #palette { grid-column: 1; padding: 10px 8px; background: #f3f3f3; border-right: 1px solid #ccc; overflow: auto; width: 168px; }
  #palette h3 { font-size: 12px; text-transform: uppercase; color: #666; margin: 0 0 8px; padding: 0 4px; }
  .palette-group-header {
    font: 600 11px "Segoe UI", sans-serif; color: #444; text-transform: uppercase;
    letter-spacing: 0.03em; padding: 6px 4px 4px; margin-top: 4px;
  }
  .palette-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px;
    cursor: grab; font: 12px "Segoe UI", sans-serif; color: #1b1b1b;
    border: 1px solid transparent;
  }
  .palette-item:hover { background: #e5f1fb; border-color: #c7e0f4; }
  .palette-item:active { cursor: grabbing; background: #cce4f7; }
  .palette-icon {
    flex: 0 0 auto; width: 20px; height: 20px; display: flex; align-items: center;
    justify-content: center; border-radius: 3px; background: #0078d4; color: #fff;
    font: 11px "Segoe UI", sans-serif; font-weight: 600;
  }

  #preview { grid-column: 2; display: block; width: 100%; height: 100%; border: 0; box-sizing: border-box; }

  #properties { grid-column: 3; padding: 12px; background: #e8e8e8; border-left: 1px solid #ccc; overflow: auto; width: 180px; }
  #properties h3 { font-size: 12px; text-transform: uppercase; color: #666; margin: 0 0 8px; }
  .prop-row { margin-bottom: 8px; }
  .prop-row label { display: block; font: 11px "Segoe UI", sans-serif; color: #555; margin-bottom: 2px; }
  .prop-row input {
    width: 100%; box-sizing: border-box; padding: 3px 5px;
    font: 12px "Segoe UI", sans-serif; border: 1px solid #adadad;
  }
  .prop-row input:disabled { background: #ddd; color: #888; }
  .prop-row.hidden { display: none; }

  #files { grid-column: 4; padding: 12px; background: #e8e8e8; overflow: auto; width: 170px; }
  .files-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .files-header h3 { font-size: 12px; text-transform: uppercase; color: #666; margin: 0; }
  #new-file-button {
    width: 20px; height: 20px; line-height: 1; border: 1px solid #adadad; border-radius: 3px;
    background: #fff; color: #333; font: 14px sans-serif; cursor: pointer; padding: 0;
  }
  #new-file-button:hover { background: #f0f0f0; }
  .file-item {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    padding: 4px 6px; margin-bottom: 2px; border-radius: 2px;
    font: 12px "Consolas", monospace; color: #333; cursor: pointer;
  }
  .file-item:hover { background: #d8d8d8; }
  .file-item .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item .file-delete {
    flex: none; color: #888; font: 12px sans-serif; visibility: hidden; padding: 0 2px;
  }
  .file-item:hover .file-delete { visibility: visible; }
  .file-item .file-delete:hover { color: #c00; }

  #tab-panels { grid-template-columns: 1fr; }
  .monaco-pane { width: 100%; height: 100%; }

  /* One third of the window tall by default; the top edge is a drag handle
     (see the script at the end of the body) and the height is clamped so
     the console can never swallow the whole page. */
  #build-console {
    display: none; flex: 0 0 33.333vh; min-height: 80px; max-height: 80vh;
    flex-direction: column; background: #000; border-top: 2px solid #0f0;
    position: relative;
  }
  #build-console.visible { display: flex; }
  #build-console-resizer {
    position: absolute; top: -6px; left: 0; right: 0; height: 10px;
    cursor: ns-resize; touch-action: none; z-index: 5;
  }
  #build-console-resizer:hover, #build-console.resizing #build-console-resizer {
    background: rgba(0, 255, 0, 0.35);
  }
  body.console-resizing { cursor: ns-resize; user-select: none; }
  body.console-resizing #preview { pointer-events: none; }
  #build-console-header {
    display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto;
    padding: 3px 6px 3px 10px; background: #0a0a0a; color: #0f0;
    font: 11px "Consolas", monospace; text-transform: uppercase; letter-spacing: 0.04em;
  }
  #build-console-close {
    background: none; border: 1px solid transparent; border-radius: 3px; color: #0f0;
    font: 16px/1 "Consolas", monospace; cursor: pointer; width: 24px; height: 22px; padding: 0;
  }
  #build-console-close:hover { color: #fff; border-color: #0f0; background: #131; }
  #build-console-log {
    flex: 1 1 auto; margin: 0; padding: 6px 10px; overflow-y: auto;
    color: #0f0; background: #000; font: 12px/1.4 "Consolas", monospace;
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>
<div id="bar">
  <span class="title" title="Drag a control onto the form, double-click it for its handler, select it and press Delete to remove it">rad-designer — drag a control onto the form, double-click it for its handler · Delete removes the selection</span>
  <span class="spacer"></span>
  <span id="build-status"></span>
  <select id="build-target" title="What to build. Windows builds need Windows 10 or later; the ARM64 build needs ARM64 hardware to run.">
    <optgroup label="Browser">
      <option value="web">Web app (.html)</option>
    </optgroup>
    <optgroup label="Windows 10+">
      <option value="x86_64-pc-windows-gnullvm" selected>Windows x64</option>
      <option value="i686-pc-windows-gnullvm">Windows x86</option>
      <option value="aarch64-pc-windows-gnullvm">Windows ARM64</option>
    </optgroup>
  </select>
  <button id="build-button" title="Build the form for the selected target and download it">Build</button>
  <button id="reset-button" title="Clear all project files and reload">Reset project</button>
  <label>Look &amp; feel
    <select id="skin-select">
      <option value="windows" selected>Windows</option>
      <option value="macos">macOS</option>
      <option value="linux">Linux</option>
      <option value="web">Web (browser default)</option>
    </select>
  </label>
</div>

<div id="tab-bar">
  <div class="tab active" id="tab-designer" data-tab="designer">Designer</div>
</div>

<div id="main">
  <div id="designer-view">
    <div id="palette">
      <h3>Toolbox</h3>
      <!-- The tiles are filled in by the designer from rad-core's component registry. -->
    </div>

    <!-- Last in source order within this grid on purpose: everything the
         iframe's wasm reaches out for via window.parent already exists by
         the time it's parsed. -->
    <iframe id="preview" src="frame.html" title="Form preview"></iframe>

    <div id="properties">
      <h3>Properties</h3>
      <div class="prop-row" id="row-name"><label>Name</label><input id="prop-name" readonly /></div>
      <div class="prop-row" id="row-text"><label>Text</label><input id="prop-text" /></div>
      <div class="prop-row" id="row-x"><label>X</label><input id="prop-x" type="number" /></div>
      <div class="prop-row" id="row-y"><label>Y</label><input id="prop-y" type="number" /></div>
      <div class="prop-row" id="row-width"><label>Width</label><input id="prop-width" type="number" /></div>
      <div class="prop-row" id="row-height"><label>Height</label><input id="prop-height" type="number" /></div>
      <div class="prop-row" id="row-checked">
        <label><input id="prop-checked" type="checkbox" style="width:auto;" /><span id="prop-checked-label"> Checked</span></label>
      </div>
      <div class="prop-row" id="row-interval"><label>Interval (ms)</label><input id="prop-interval" type="number" min="1" /></div>
      <div class="prop-row" id="row-range">
        <label>Minimum</label><input id="prop-minimum" type="number" />
        <label style="margin-top:6px;">Maximum</label><input id="prop-maximum" type="number" />
      </div>
      <div class="prop-row" id="row-value"><label>Value</label><input id="prop-value" type="number" /></div>
      <div class="prop-row" id="row-selected"><label>Selected index (-1 = none)</label><input id="prop-selected" type="number" min="-1" /></div>
      <div class="prop-row" id="row-image-path"><label>Image path</label><input id="prop-image-path" placeholder="C:\path\to\image.bmp" /></div>
      <div class="prop-row" id="row-items">
        <label>Items (one per line; a tree view nests by indenting)</label>
        <textarea id="prop-items" rows="5" style="width:100%; box-sizing:border-box; font:12px 'Segoe UI', sans-serif; border:1px solid #adadad; resize:vertical;"></textarea>
      </div>
    </div>

    <div id="files">
      <div class="files-header">
        <h3>Files</h3>
        <button id="new-file-button" title="New file">+</button>
      </div>
      <div id="file-list"><!-- populated from the designer's file store --></div>
    </div>
  </div>

  <div id="tab-panels"></div>
</div>

<div id="build-console">
  <div id="build-console-resizer" title="Drag to resize"></div>
  <div id="build-console-header">
    <span>Build Console</span>
    <button id="build-console-close" title="Close" aria-label="Close build console">×</button>
  </div>
  <pre id="build-console-log"></pre>
</div>
<script>
// Remember the last chosen build target. Only a value that is still one of the
// options is restored, and every storage access is guarded.
(function () {
  var select = document.getElementById("build-target");
  var KEY = "rad-designer.build-target";
  try {
    var saved = localStorage.getItem(KEY);
    if (saved && Array.prototype.some.call(select.options, function (o) { return o.value === saved; })) {
      select.value = saved;
    }
  } catch (e) { /* storage unavailable: keep the default */ }
  select.addEventListener("change", function () {
    try { localStorage.setItem(KEY, select.value); } catch (e) {}
  });
})();
</script>
<script>
// Vertical resize for the build console: drag its top edge. The height is
// remembered per browser (localStorage may be unavailable, so every access is
// guarded) and clamped to the same bounds the CSS enforces.
(function () {
  var panel = document.getElementById("build-console");
  var handle = document.getElementById("build-console-resizer");
  var KEY = "rad-designer.console-height";
  var MIN = 80;

  function clamp(px) { return Math.max(MIN, Math.min(px, window.innerHeight * 0.8)); }
  function apply(px) { panel.style.flexBasis = clamp(px) + "px"; }

  try {
    var saved = parseFloat(localStorage.getItem(KEY));
    if (saved > 0) apply(saved);
  } catch (e) { /* storage unavailable: keep the 1/3 default */ }

  handle.addEventListener("pointerdown", function (e) {
    handle.setPointerCapture(e.pointerId);
    panel.classList.add("resizing");
    document.body.classList.add("console-resizing");
    e.preventDefault();
  });
  handle.addEventListener("pointermove", function (e) {
    if (!handle.hasPointerCapture(e.pointerId)) return;
    apply(window.innerHeight - e.clientY);
  });
  function stop(e) {
    if (!handle.hasPointerCapture(e.pointerId)) return;
    handle.releasePointerCapture(e.pointerId);
    panel.classList.remove("resizing");
    document.body.classList.remove("console-resizing");
    try { localStorage.setItem(KEY, String(panel.getBoundingClientRect().height)); } catch (err) {}
  }
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);
  // Double-click restores the one-third default.
  handle.addEventListener("dblclick", function () {
    panel.style.flexBasis = "";
    try { localStorage.removeItem(KEY); } catch (err) {}
  });
})();
</script>
</body>
</html>
